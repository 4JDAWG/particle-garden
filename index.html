<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Garden</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05050a;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    background: rgba(15, 15, 25, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    color: #e8e8f0;
    font-size: 13px;
    user-select: none;
    transition: opacity 0.3s;
  }
  #ui h1 {
    font-size: 14px;
    margin: 0 0 2px 0;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #fff;
  }
  #ui .hint {
    font-size: 11.5px;
    color: #9c9cb0;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  button {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e8e8f0;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover {
    background: rgba(255, 255, 255, 0.16);
  }
  button:active {
    transform: scale(0.96);
  }
  button.active {
    background: #6c5ce7;
    border-color: #8c7ff7;
  }
  #fade-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="range"] {
    accent-color: #8c7ff7;
    width: 100px;
  }
  #fps {
    position: fixed;
    bottom: 12px;
    right: 14px;
    color: #55556a;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>🌱 Particle Garden</h1>
  <div class="hint">Click &amp; drag to plant particles.<br>Try the modes below.</div>
  <div class="row">
    <button data-mode="attract" class="active">Attract</button>
    <button data-mode="repel">Repel</button>
    <button data-mode="swirl">Swirl</button>
    <button data-mode="paint">Paint</button>
  </div>
  <div class="row">
    <button id="clear">Clear</button>
    <button id="pause">Pause</button>
  </div>
  <div id="fade-row">
    <span>Trail</span>
    <input type="range" id="fade" min="1" max="40" value="8">
  </div>
</div>

<div id="fps"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- state ----------
  const particles = [];
  const MAX_PARTICLES = 2200;
  let mode = 'attract';
  let fadeAmount = 8; // controls trail persistence (converted to alpha)
  let paused = false;

  const pointer = { x: W / 2, y: H / 2, down: false, px: W / 2, py: H / 2 };

  function hueForTime(t) {
    return (t * 0.03) % 360;
  }

  class Particle {
    constructor(x, y, hue) {
      this.x = x;
      this.y = y;
      const a = Math.random() * Math.PI * 2;
      const speed = Math.random() * 1.5;
      this.vx = Math.cos(a) * speed;
      this.vy = Math.sin(a) * speed;
      this.hue = hue;
      this.size = 1.5 + Math.random() * 2.2;
      this.life = 1;
      this.decay = 0.0015 + Math.random() * 0.002;
    }
  }

  function spawnBurst(x, y, count, hue) {
    for (let i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      particles.push(new Particle(x, y, hue));
    }
  }

  // ---------- interaction ----------
  function setMode(m) {
    mode = m;
    document.querySelectorAll('#ui .row button[data-mode]').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === m);
    });
  }

  document.querySelectorAll('#ui .row button[data-mode]').forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });

  document.getElementById('clear').addEventListener('click', () => {
    particles.length = 0;
  });

  const pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });

  const fadeSlider = document.getElementById('fade');
  fadeSlider.addEventListener('input', () => {
    fadeAmount = Number(fadeSlider.value);
  });

  function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();
    pointer.px = pointer.x;
    pointer.py = pointer.y;
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
  }

  canvas.addEventListener('pointerdown', (e) => {
    pointer.down = true;
    updatePointer(e);
    spawnBurst(pointer.x, pointer.y, 18, hueForTime(performance.now()));
  });
  canvas.addEventListener('pointerup', () => pointer.down = false);
  canvas.addEventListener('pointerleave', () => pointer.down = false);
  canvas.addEventListener('pointermove', (e) => {
    updatePointer(e);
    if (pointer.down) {
      spawnBurst(pointer.x, pointer.y, 4, hueForTime(performance.now()));
    }
  });

  // gentle ambient sprinkle so the garden feels alive even before interacting
  let ambientTimer = 0;

  // ---------- physics ----------
  function step(dt, t) {
    const mx = pointer.x, my = pointer.y;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const dx = mx - p.x;
      const dy = my - p.y;
      const distSq = dx * dx + dy * dy + 40;
      const dist = Math.sqrt(distSq);

      if (pointer.down) {
        if (mode === 'attract') {
          const force = 120 / distSq;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        } else if (mode === 'repel') {
          const force = 180 / distSq;
          p.vx -= (dx / dist) * force;
          p.vy -= (dy / dist) * force;
        } else if (mode === 'swirl') {
          const force = 140 / distSq;
          p.vx += (-dy / dist) * force;
          p.vy += (dx / dist) * force;
          p.vx += (dx / dist) * force * 0.15;
          p.vy += (dy / dist) * force * 0.15;
        } else if (mode === 'paint') {
          // paint mode: particles mostly stay where drawn, gentle drift
          p.vx += (Math.random() - 0.5) * 0.05;
          p.vy += (Math.random() - 0.5) * 0.05;
        }
      }

      // gentle drift + friction
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.vy += 0.003; // faint gravity

      p.x += p.vx;
      p.y += p.vy;

      // wrap-around edges (feels like a living garden, not a box)
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;

      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }

    // ambient sprinkle when idle
    ambientTimer += dt;
    if (!pointer.down && ambientTimer > 120 && particles.length < 300) {
      ambientTimer = 0;
      spawnBurst(Math.random() * W, Math.random() * H, 1, hueForTime(t));
    }
  }

  // ---------- render ----------
  function render() {
    // fade previous frame instead of clearing -> trails
    ctx.fillStyle = `rgba(5, 5, 10, ${fadeAmount / 100})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const alpha = Math.max(p.life, 0);
      ctx.beginPath();
      const r = p.size * (0.6 + p.life * 0.6);
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
      grad.addColorStop(0, `hsla(${p.hue}, 90%, 70%, ${alpha})`);
      grad.addColorStop(1, `hsla(${p.hue}, 90%, 60%, 0)`);
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- loop ----------
  let last = performance.now();
  let frames = 0, fpsTimer = 0;
  const fpsEl = document.getElementById('fps');

  function loop(now) {
    const dt = now - last;
    last = now;

    if (!paused) {
      step(dt, now);
      render();
    }

    frames++;
    fpsTimer += dt;
    if (fpsTimer > 500) {
      fpsEl.textContent = `${particles.length} particles · ${Math.round(frames / (fpsTimer / 1000))} fps`;
      frames = 0;
      fpsTimer = 0;
    }

    requestAnimationFrame(loop);
  }

  // seed a small welcoming burst
  spawnBurst(W / 2, H / 2, 60, 260);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
